# Installation automatisée de Debian 13, pour l'appliance dsoxlab.
#
# Servi par Packer pendant le boot de l'ISO netinst (`http_directory`). Tout ce
# qui n'est pas ici est demandé à l'écran, et le build reste alors bloqué pour
# toujours : un preseed incomplet ne se voit pas autrement que par un timeout.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string dsoxlab
d-i netcfg/get_domain string lab
# Un nom d'hôte déjà fourni par la ligne de boot : ne pas le redemander.
d-i netcfg/hostname string dsoxlab

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitionnement : tout dans une seule partition. Le disque de l'appliance
# n'héberge pas de données à isoler, et un schéma LVM compliquerait la vie de
# celui qui voudra l'agrandir depuis son hyperviseur.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Pas de compte root : `student` passe par sudo, comme sur les hôtes des labs.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string student
d-i passwd/username string student
d-i passwd/user-password password dsoxlab
d-i passwd/user-password-again password dsoxlab
# Ce mot de passe ne survit pas à l'image : `30-premier-demarrage.sh` force son
# changement à la première connexion (`chage -d 0`).
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Aucun firmware non libre dans une VM : le seul que la priorité `standard`
# apportait est le microcode processeur, inutile sous hyperviseur, et il coûte
# 34 Mio compressés avec sa copie dans l'initrd (mesuré).
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false

# Pas de tâche `standard` : 248 Mio bruts mesurés, pour des paquets que
# `10-base.sh` réinstalle de toute façon (python3, openssh-client) ou dont
# personne n'a besoin ici (reportbug, debian-faq, iso-codes, apt-listchanges).
# Ce que `standard` apportait d'utile est réajouté nommément par `10-base.sh`.
tasksel tasksel/first multiselect ssh-server
# Le minimum : les outils viennent des scripts de provisioning, pas d'ici, pour
# qu'on puisse les relire et les versionner. `locales` est explicite parce que
# sans la tâche `standard` il n'arrive plus tout seul.
d-i pkgsel/include string sudo curl ca-certificates git openssh-server locales
d-i pkgsel/upgrade select full-upgrade
# Aucune télémétrie : le projet n'en collecte pas, l'image non plus.
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# `student` doit pouvoir élever ses droits sans mot de passe : c'est ce que
# `dsoxlab provision` attend sur un poste de lab, et le compte est local à une VM
# jetable. La règle est posée ici plutôt que dans un script pour qu'elle existe
# dès le premier boot, y compris si un script échoue.
d-i preseed/late_command string \
    in-target sh -c 'echo "student ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/student'; \
    in-target chmod 0440 /etc/sudoers.d/student
