# OpenSSF Scorecard: measures the repository's supply-chain security posture
# (branch protection, pinned dependencies, token permissions, code review, …)
# and publishes the result to the public Scorecard viewer and the README badge.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard needs a public repository (commit-graph API + result
    # publication). Skips while private (pre-launch); activates once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The privileged token lives in this protected environment, restricted to
    # the main branch. This workflow never runs on `pull_request`, so the token
    # is unreachable from a fork. Same model as plumber.yml.
    environment: security
    permissions:
      contents: read
      security-events: write   # upload SARIF to Code Scanning
      id-token: write          # publish results to the OpenSSF Scorecard API
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two attempts, and this is not superstition.
      #
      # GitHub's GraphQL API intermittently returns an internal error when
      # Scorecard runs RIGHT AFTER a push: "ListCommits: error during
      # graphqlHandler.setup: internal error: githubv4.Query: Something went
      # wrong while executing your query". The commit has just landed and its
      # associated data has not propagated on GitHub's side yet.
      #
      # Measured on 2026-09-15 across the fleet: several push runs failed during
      # a burst of merges, and the SAME repositories analysed cleanly minutes
      # later without a single line having changed. The query was replayed by
      # hand: it passes. So this is not broken data, it is a moment.
      #
      # Without a second attempt the branch stays red for a failure that is not
      # ours, and a red branch people learn to ignore stops being useful.
      - name: Run Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Without this, Branch-Protection cannot be evaluated at all: the
          # default GITHUB_TOKEN may not read *classic* branch protection, and
          # the check returned `-1` — an internal error, silently excluded from
          # the average rather than scored.
          #
          # A fine-grained PAT with `Administration: Read` (plus the Metadata
          # that comes with it) is what Scorecard documents for this case. The
          # token is reused from plumber.yml, which needs the exact same right
          # for `branchMustBeProtected` — one privileged credential to rotate,
          # not two.
          #
          # Note: had this repository used a *ruleset* instead of classic branch
          # protection, no token would be needed — rulesets are readable by the
          # default GITHUB_TOKEN.
          repo_token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}

      - name: Let GitHub propagate the commit
        if: steps.scorecard.outcome == 'failure'
        run: sleep 90

      # This one carries NO continue-on-error: if the second attempt fails too,
      # the job fails, which is exactly what we want. A workflow that can no
      # longer fail no longer measures anything.
      - name: Run Scorecard (second attempt)
        if: steps.scorecard.outcome == 'failure'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Without this, Branch-Protection cannot be evaluated at all: the
          # default GITHUB_TOKEN may not read *classic* branch protection, and
          # the check returned `-1` — an internal error, silently excluded from
          # the average rather than scored.
          #
          # A fine-grained PAT with `Administration: Read` (plus the Metadata
          # that comes with it) is what Scorecard documents for this case. The
          # token is reused from plumber.yml, which needs the exact same right
          # for `branchMustBeProtected` — one privileged credential to rotate,
          # not two.
          #
          # Note: had this repository used a *ruleset* instead of classic branch
          # protection, no token would be needed — rulesets are readable by the
          # default GITHUB_TOKEN.
          repo_token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
