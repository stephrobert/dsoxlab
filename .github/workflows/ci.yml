# Contribution gate. Three workflow scanners run first, in parallel, as a fast
# security gate: zizmor (workflow vulnerabilities), actionlint (syntax, invalid
# permission scopes, shellcheck) and poutine (CI/CD exploitation chains). The
# heavier jobs (quality matrix, pre-commit parity, fuzzing, CodeQL) only run
# once all three pass, so an insecure workflow fails fast without burning
# runners.
#
# The compliance score and the repository-settings checks live in plumber.yml
# (trusted context only — it needs a privileged token); supply-chain posture in
# scorecard.yml.
#
# Hardening baseline: every action is pinned to a full commit SHA, the default
# token has no permissions, each job grants only what it needs, checkout never
# persists credentials, and jobs are time-boxed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny-by-default: jobs opt into the scopes they need, nothing is inherited.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast security gate — the quality and CodeQL jobs depend on it.
  zizmor:
    name: Zizmor (workflow static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # First step of every job: monitor egress and block the runner from being
      # tampered with. `audit` records outbound calls without failing the run —
      # the recorded list is what a future `block` policy would be built from.
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gate-only (no SARIF upload) so the check also passes on pull requests
      # from forks, where the token cannot write to code scanning. Findings in
      # the Security tab come from CodeQL and plumber.yml on same-repo events.
      - name: Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.26.1"
          advanced-security: false

  # Workflow syntax gate. actionlint is what refuses an invalid runner label, a
  # malformed ${{ }} expression or a permission scope that does not exist — the
  # class of mistake that silently disables a control rather than failing loudly.
  # It also runs shellcheck over every `run:` block.
  actionlint:
    name: Actionlint (workflow syntax)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verified release binary rather than a third-party action: the scanner
      # that guards the pipeline must not itself widen the trust boundary.
      # Same pattern as the trufflehog install below (no piped remote script).
      - name: Install actionlint (verified release binary)
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${workdir}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" actionlint
          sudo install -m 0755 "${workdir}/actionlint" /usr/local/bin/actionlint
          actionlint --version

      - name: Actionlint
        run: actionlint -color

  # CI/CD exploitation-chain gate. poutine models triggers, permissions and data
  # flow to surface complete attack scenarios, and flags actions from unverified
  # creators. Acknowledged false positives live in .poutine.yml, per purl.
  poutine:
    name: Poutine (CI/CD exploitation chains)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install poutine (verified release binary)
        env:
          POUTINE_VERSION: "1.1.6"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/boostsecurityio/poutine/releases/download/v${POUTINE_VERSION}"
          asset="poutine_Linux_x86_64.tar.gz"
          curl -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${workdir}/checksums.txt" "${base}/poutine_${POUTINE_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" poutine
          sudo install -m 0755 "${workdir}/poutine" /usr/local/bin/poutine
          poutine version

      # --fail-on-violation makes this a gate (exit 10) instead of a report.
      - name: Poutine
        run: poutine analyze_local . --fail-on-violation --quiet

  terraform:
    name: Terraform templates (three providers)
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pattern as poutine above: the vendor's own release archive, with
      # the checksum it publishes alongside. No third-party action is added to
      # the supply chain for a binary we only need to run twice.
      - name: Install terraform (verified release binary)
        env:
          TERRAFORM_VERSION: "1.15.4"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          asset="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${workdir}/checksums.txt" \
            "${base}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "${workdir}" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          unzip -q "${workdir}/${asset}" -d "${workdir}"
          sudo install -m 0755 "${workdir}/terraform" /usr/local/bin/terraform
          terraform version

      # The templates are pinned to `~> 0.9` (kvm) and `~> 0.3` (incus): a minor
      # provider release can break the schema, and this repository has already
      # lived through it — the comments in templates/terraform/kvm/main.tf
      # document the 0.8 → 0.9 break. Nothing in CI could see it: the unit tests
      # on these templates assert that a file contains a string, not that
      # Terraform can read it.
      #
      # Validation runs IN PLACE, via -chdir. It matters: the outscale template
      # reaches its cloud-init through `${path.module}/../../cloud-init/`, so
      # copying the .tf files into an isolated directory reports a bogus failure
      # on a template that is perfectly valid.
      #
      # No tfvars are needed, and that is not an oversight: `validate` checks
      # the configuration itself and never resolves variable values — only
      # `plan` would, and `plan` needs a reachable hypervisor.
      - name: Validate every packaged provider
        run: |
          set -uo pipefail
          broken=""
          for provider in kvm incus outscale; do
            dir="src/dsoxlab/templates/terraform/${provider}"
            echo "::group::${provider}"
            if terraform -chdir="${dir}" init -backend=false -input=false -no-color \
              && terraform -chdir="${dir}" validate -no-color; then
              echo "${provider}: valid"
            else
              broken="${broken} ${provider}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${broken}" ]; then
            echo "::error::Invalid Terraform templates:${broken}"
            exit 1
          fi
          echo "All three packaged providers are valid."

  quality:
    name: Lint, type-check and test (py${{ matrix.python-version }})
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.14 n'est pas une anticipation : Fedora et Ubuntu 26.04 le
        # packagent déjà, et l'environnement de développement de ce dépôt
        # tourne dessus. La matrice mesurait donc trois versions dont
        # aucune n'était celle qui sert tous les jours.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # Passed through the environment (not template-expanded into run blocks)
      # so no context value is ever interpolated into shell code.
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Sync dependencies (locked)
        run: uv sync --frozen --python "$PYTHON_VERSION"

      # `scripts` is listed on purpose: the pre-commit hook runs ruff on EVERY
      # Python file, so leaving it out here made this job pass while the parity
      # job failed on the same code — the wrong order to learn it in.
      - name: Lint and security (ruff)
        run: uv run ruff check src/dsoxlab tests tests_e2e fuzz scripts

      - name: Type-check (mypy strict)
        run: uv run mypy src/dsoxlab

      - name: Test (pytest)
        run: uv run pytest

  # End-to-end gate — the only job that exercises the PROGRAM AS INSTALLED.
  #
  # The `quality` matrix above imports the package from `src/`, so it proves the
  # functions do what they say and nothing about the distribution: a data file
  # missing from the wheel, a broken `console_scripts` entry point or an import
  # that only resolves in the source tree all pass it. This job builds the
  # wheel, installs it into a throwaway venv and drives the `dsoxlab` binary by
  # subprocess, from `demo` to a 100/100 score — the exact path a newcomer
  # walks, and the one nobody replayed.
  #
  # No hypervisor, no Docker, no privilege: the packaged demonstration catalog
  # is a `shell` lab, so this runs on a bare runner. Separate job on purpose —
  # a red E2E and a red unit suite do not mean the same thing.
  e2e:
    name: End-to-end (black box, installed wheel)
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      # Warms the uv cache with exactly the dependencies the wheel declares, so
      # the throwaway venv the suite creates is filled from disk instead of the
      # network. It is also what provides pytest to run the suite itself.
      - name: Sync dependencies (locked)
        run: uv sync --frozen

      # `tests_e2e/pytest.ini` is this suite's own configuration: the project's
      # `testpaths` deliberately excludes it, so `uv run pytest` never picks it
      # up by accident and the contribution gate keeps its measured duration.
      - name: End-to-end suite (build the wheel, install it, drive the binary)
        run: uv run pytest tests_e2e

  # The wheel every distribution job installs — built ONCE, on purpose.
  #
  # Letting each distribution build its own would make five artifacts and prove
  # nothing about the one PyPI serves. It would also hide a packaging bug behind
  # a build that happens to work on that particular system. One artifact, five
  # systems: any difference in the outcome then belongs to the system.
  roue:
    name: Build the wheel (once, for every distribution)
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Publish it for the distribution jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roue-parcours
          path: dist/*.whl
          retention-days: 1
          if-no-files-found: error

  # Distribution gate — the users of dsoxlab do not have different Python
  # versions, they have different DISTRIBUTIONS.
  #
  # That is where the product breaks, because what it drives (ssh, terraform,
  # libvirt, docker, sudo) is packaged differently there, in different versions,
  # under different paths. A matrix that only varies Python on a single Ubuntu
  # measures none of it.
  #
  # `UV_PYTHON_DOWNLOADS=never` (set by the script) is what gives this job its
  # meaning: uv installs its own standalone CPython by default, identical
  # everywhere, and the matrix would then measure GitHub's network rather than
  # the systems. Pinned off, the wheel installs on the Python the distribution
  # ships — the only way to learn that one of them ships a Python too old.
  #
  # The scenario is the E2E suite itself, not a copy of it: one scenario, five
  # systems. `fail-fast: false` because "Fedora is red" and "Arch is red" are
  # two different pieces of news, and stopping at the first hides the second.
  distributions:
    name: Parcours on ${{ matrix.nom }}
    needs: [roue]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Debian 13
            image: debian:13
            amorcage: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip >/dev/null
          - nom: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            amorcage: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip >/dev/null
          - nom: Ubuntu 26.04 LTS
            image: ubuntu:26.04
            amorcage: apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip >/dev/null
          - nom: Fedora
            image: fedora:latest
            amorcage: dnf install -y -q python3 python3-pip >/dev/null
          # `-Syu`, never `-Sy`: a partial upgrade pulls a python built against
          # a newer glibc than the image ships, and every import of a C module
          # then fails on `GLIBC_2.44 not found`. Seen while writing this job.
          - nom: Arch Linux
            image: archlinux:latest
            amorcage: pacman -Syu --noconfirm --quiet python python-pip >/dev/null
    env:
      # Passed through the environment (not template-expanded into run blocks)
      # so no context value is ever interpolated into shell code.
      IMAGE: ${{ matrix.image }}
      AMORCAGE: ${{ matrix.amorcage }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the wheel built once
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roue-parcours
          path: dist

      # The repository is mounted READ-ONLY inside the container: a newcomer's
      # parcours never writes into the tool's own sources, and if it ever needs
      # to, that is a defect this mount makes visible.
      - name: Parcours end to end
        run: |
          roue=$(find dist -name '*.whl' | head -1)
          python3 scripts/parcours-distribution.py \
            --image "$IMAGE" --bootstrap "$AMORCAGE" --wheel "$roue"

  # Parity gate — run EVERY pre-commit hook (commit AND push stages) exactly as
  # a contributor's local pre-commit would, from this project's locked env. The
  # quality matrix above proves the code works on every supported Python; this
  # job proves nothing enforced locally (hygiene, ruff, mypy, trufflehog,
  # pytest) can be slipped past with `git commit --no-verify`. It runs the
  # committed .pre-commit-config.yaml itself — no hand-maintained copy to drift.
  pre-commit:
    name: Pre-commit parity (all hooks)
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # trufflehog walks git history

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Install trufflehog (verified release binary; the hook runs with --no-update)
        # Download the pinned release tarball and verify its SHA-256 against the
        # published checksums before use — no piped remote script (Plumber
        # ISSUE-411). Same version as the local pre-commit toolchain.
        env:
          TRUFFLEHOG_VERSION: "3.95.2"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${workdir}/checksums.txt" "${base}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" trufflehog
          sudo install -m 0755 "${workdir}/trufflehog" /usr/local/bin/trufflehog
          trufflehog --version

      - name: Run every hook (commit stage)
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Run every hook (push stage)
        run: uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure --color always

  # Short fuzzing regression over every input the engine does NOT produce
  # itself. Each one is untrusted for a different reason, and the reason is what
  # decides the contract each harness asserts:
  #
  #   lab.yaml, meta.yml       written by a lab-provider repository.
  #                            discovery/scanner.py only catches KeyError,
  #                            ValueError and YAMLError; anything else crashes
  #                            the CLI on an unrelated command.
  #   .dsoxlab-context.json    written by `use`, but living on the learner's
  #                            disk: hand-edited, truncated by a laptop closed
  #                            mid-write, left over by an older version.
  #                            read_context must NEVER raise, so that harness
  #                            has no contract exception at all.
  #   terraform outputs        produced by an external binary whose version,
  #                            providers and output schema all move without
  #                            dsoxlab knowing. The harness targets what
  #                            build_inventory does with the decoded document,
  #                            not the json.loads that precedes it.
  #
  # This is a regression gate, not a fuzzing campaign: a short seeded run keeps
  # the harnesses alive and catches the obvious breakages. Deep runs are done
  # locally with a persistent corpus.
  fuzz:
    name: Fuzz every untrusted input (short run)
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync dependencies (locked, with the fuzz group)
        run: uv sync --frozen --group fuzz

      # Scratch dir first, seed corpus second: libFuzzer writes what it finds
      # into the first directory, and fuzz/corpus/ is a curated seed set.
      - name: Fuzz the lab.yaml parser
        run: |
          mkdir -p "${RUNNER_TEMP}/fuzz-lab"
          uv run --group fuzz python fuzz/fuzz_lab_yaml.py \
            "${RUNNER_TEMP}/fuzz-lab" fuzz/corpus/lab_yaml/ \
            -dict=fuzz/dict/yaml_contract.dict \
            -atheris_runs=20000 -max_len=4096

      - name: Fuzz the meta.yml parser
        run: |
          mkdir -p "${RUNNER_TEMP}/fuzz-meta"
          uv run --group fuzz python fuzz/fuzz_meta_yaml.py \
            "${RUNNER_TEMP}/fuzz-meta" fuzz/corpus/meta_yml/ \
            -dict=fuzz/dict/yaml_contract.dict \
            -atheris_runs=20000 -max_len=4096

      # Pas de -dict ici : yaml_contract.dict porte des mots-clés du contrat
      # YAML, sans rapport avec un document JSON. Un dictionnaire hors sujet
      # coûte du budget sans guider la mutation.
      - name: Fuzz the local session context
        run: |
          mkdir -p "${RUNNER_TEMP}/fuzz-context"
          uv run --group fuzz python fuzz/fuzz_context_json.py \
            "${RUNNER_TEMP}/fuzz-context" fuzz/corpus/context_json/ \
            -atheris_runs=20000 -max_len=4096

      - name: Fuzz the Terraform outputs the inventory is built from
        run: |
          mkdir -p "${RUNNER_TEMP}/fuzz-tfout"
          uv run --group fuzz python fuzz/fuzz_terraform_outputs.py \
            "${RUNNER_TEMP}/fuzz-tfout" fuzz/corpus/terraform_outputs/ \
            -atheris_runs=20000 -max_len=4096

      # A crash writes a `crash-*` reproducer next to the harness. Keep it: it
      # is the exact input needed to replay the failure locally.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL analyze (python)
    needs: [zizmor, actionlint, poutine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload the CodeQL results to Code Scanning
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none   # Python is interpreted, no build step to observe

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:python"
