# Pre-commit hooks for dsoxlab. This repository ships public, so the hooks are a
# hard stop against leaking secrets/keys and against pushing artifacts that do
# not belong in the tree.
#
# Install once:  uv run pre-commit install --install-hooks
# (this wires both the pre-commit and pre-push stages)
# Run on everything:  uv run pre-commit run --all-files
#
# The ruff/mypy/pytest hooks call `uv run …` on purpose: the tool versions come
# from this project's lockfile, so the hooks behave exactly like CI — one source
# of truth, no drift between a mirrored hook and the project's own toolchain.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  # General hygiene + a hard stop on committing secrets and private keys.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(^LICENSE$|\.md$)'
      - id: end-of-file-fixer
        exclude: '^LICENSE$'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key           # blocks SSH keys — dsoxlab generates lab keys
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Project toolchain — lint + security (ruff S rules), strict typing, tests.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + security)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src/dsoxlab
        language: system
        pass_filenames: false
        files: ^src/dsoxlab/.*\.py$

      - id: trufflehog
        name: trufflehog (secret scan)
        # --no-update: never auto-fetch a new binary at hook time (supply-chain hardening).
        entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --no-update
        language: system
        pass_filenames: false

      # An invalid dependabot.yml fails silently: GitHub rejects the whole file
      # and simply stops opening update PRs, which looks exactly like "no
      # updates available".
      #
      # What this catches, measured by feeding it each mistake: a misspelled
      # key (`groupes:` for `groups:`), an invented `update-types` value, an
      # unknown ecosystem.
      #
      # What it does NOT catch, also measured: per-ecosystem restrictions. The
      # `semver-*-days` cooldown tiers that this project once declared under
      # github-actions, which GitHub refuses, pass the schema without a word
      # because they are legal for other ecosystems. So this hook narrows the
      # gap, it does not close it.
      - id: dependabot-schema
        name: dependabot.yml matches the official schema
        entry: uvx check-jsonschema --builtin-schema vendor.dependabot
        language: system
        files: '^\.github/dependabot\.yml$'

      # Une table de commandes écrite à la main dérive sans que personne
      # ne s'en aperçoive : celle du README annonçait encore un `cleanup.sh`
      # que le zéro-bash interdit, et il y manquait deux commandes. Elle est
      # désormais produite par la CLI, et ce hook refuse une version périmée.
      - id: doc-a-jour
        name: la documentation décrit la CLI réelle
        entry: python3 scripts/generer-doc.py --verifier
        language: system
        pass_filenames: false
        files: '^(src/dsoxlab/(cli\.py|i18n/)|README(\.fr)?\.md|scripts/generer-doc\.py)'

      # Full test suite runs on push (kept off the per-commit path for speed).
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
