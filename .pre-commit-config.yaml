# Pre-commit hooks for dsoxlab. This repository ships public, so the hooks are a
# hard stop against leaking secrets/keys and against pushing artifacts that do
# not belong in the tree.
#
# Install once:  uv run pre-commit install --install-hooks
# (this wires both the pre-commit and pre-push stages)
# Run on everything:  uv run pre-commit run --all-files
#
# The ruff/mypy/pytest hooks call `uv run …` on purpose: the tool versions come
# from this project's lockfile, so the hooks behave exactly like CI — one source
# of truth, no drift between a mirrored hook and the project's own toolchain.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  # General hygiene + a hard stop on committing secrets and private keys.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(^LICENSE$|\.md$)'
      # `fuzz/corpus/` est hors du périmètre de l'hygiène, et pas par
      # commodité : ce sont des graines DÉLIBÉRÉMENT malformées, qui existent
      # pour être données à un fuzzer. Un JSON tronqué au milieu d'une chaîne
      # reproduit un portable refermé pendant l'écriture ; le « réparer » ou le
      # refuser retire au corpus le cas qu'il porte. Le contrat des documents,
      # lui, est tenu par les harnais eux-mêmes, pas par ces hooks.
      - id: end-of-file-fixer
        exclude: '(^LICENSE$|^fuzz/corpus/)'
      - id: check-yaml
        exclude: '^fuzz/corpus/'
      - id: check-json
        exclude: '^fuzz/corpus/'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key           # blocks SSH keys — dsoxlab generates lab keys
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Project toolchain — lint + security (ruff S rules), strict typing, tests.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + security)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src/dsoxlab
        language: system
        pass_filenames: false
        files: ^src/dsoxlab/.*\.py$

      - id: trufflehog
        name: trufflehog (secret scan)
        # --no-update: never auto-fetch a new binary at hook time (supply-chain hardening).
        entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --no-update
        language: system
        pass_filenames: false

      # An invalid dependabot.yml fails silently: GitHub rejects the whole file
      # and simply stops opening update PRs, which looks exactly like "no
      # updates available".
      #
      # What this catches, measured by feeding it each mistake: a misspelled
      # key (`groupes:` for `groups:`), an invented `update-types` value, an
      # unknown ecosystem.
      #
      # What it does NOT catch, also measured: per-ecosystem restrictions. The
      # `semver-*-days` cooldown tiers that this project once declared under
      # github-actions, which GitHub refuses, pass the schema without a word
      # because they are legal for other ecosystems. So this hook narrows the
      # gap, it does not close it.
      - id: dependabot-schema
        name: dependabot.yml matches the official schema
        entry: uvx check-jsonschema --builtin-schema vendor.dependabot
        language: system
        files: '^\.github/dependabot\.yml$'

      # Une table de commandes écrite à la main dérive sans que personne
      # ne s'en aperçoive : celle du README annonçait encore un `cleanup.sh`
      # que le zéro-bash interdit, et il y manquait deux commandes. Elle est
      # désormais produite par la CLI, et ce hook refuse une version périmée.
      - id: doc-a-jour
        name: la documentation décrit la CLI et les chemins réels
        entry: python3 scripts/generer-doc.py --verifier
        language: system
        pass_filenames: false
        files: '^(src/dsoxlab/.*\.py|docs/.*\.md|[A-Z]+(\.fr)?\.md|scripts/generer-doc\.py)$'

      # ── Qualité : la dette se paie en même temps qu'on produit ──────────────
      #
      # Ces trois hooks ne mesurent pas un absolu, ils mesurent une DÉRIVE. Un
      # seuil absolu n'était pas jouable (35 blocs dépassent déjà les seuils, et
      # les interdire d'un coup bloquerait tout commit) ; un cliquet l'est. Les
      # relevés de référence vivent dans `scripts/*-reference.json` et ne
      # peuvent que descendre : une amélioration non entérinée fait échouer le
      # hook elle aussi, parce qu'une dette payée qui n'est pas enregistrée se
      # reprend en silence au commit suivant.
      #
      # Ils appellent `python3` et non `uv run` : ils n'ont aucune dépendance
      # hors de la bibliothèque standard, à dessein, pour qu'un cache uv en
      # lecture seule ne puisse pas les désarmer.

      - id: complexite
        name: la complexité cognitive ne monte pas
        entry: python3 scripts/complexite.py --verifier
        language: system
        pass_filenames: false
        files: '^(src/dsoxlab/.*\.py|scripts/complexite(-reference\.json|\.py))$'

      - id: code-mort
        name: aucun symbole sans appelant n'est apparu
        entry: python3 scripts/code-mort.py --verifier
        language: system
        pass_filenames: false
        files: '^(src/dsoxlab/.*\.py|tests/.*\.py|docs/.*\.md|scripts/code-mort(-reference\.json|\.py))$'

      # Full test suite runs on push (kept off the per-commit path for speed).
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Au push seulement : il exécute de VRAIES commandes à plusieurs largeurs
      # de terminal, ce qui prend une dizaine de secondes. C'est le seul
      # contrôle qui regarde ce que l'apprenant a sous les yeux plutôt que la
      # forme du code, et il attrape ce qu'aucun lint ne voit : un tableau
      # illisible à 80 colonnes, une sortie d'outil déversée telle quelle, un
      # écran qui répond en une ligne sans dire quoi faire.
      - id: complexite-ecran
        name: la charge d'écran des parcours ne monte pas
        entry: python3 scripts/complexite-ecran.py --verifier
        language: system
        pass_filenames: false
        stages: [pre-push]
