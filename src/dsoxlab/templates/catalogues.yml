# Catalogues connus de dsoxlab.
#
# Ce fichier est une DONNÉE, pas de la logique : le moteur ne lit ici que des
# noms, des URL et des descriptions, et n'en tire aucune décision propre à un
# domaine. Écrire `if nom == "linux"` dans le code romprait l'agnosticisme que
# ce fichier existe précisément pour préserver.
#
# Pourquoi un fichier packagé plutôt qu'un registre distant : un registre est un
# service à héberger, surveiller et maintenir disponible. Un manifeste versionné
# a de plus un mérite qu'un service n'a pas — il est révisable en pull request :
# proposer un catalogue tiers devient une contribution ordinaire, relue comme le
# reste.
#
# `dsoxlab catalog add <url>` accepte n'importe quelle URL git, y compris
# absente d'ici : ce fichier facilite la découverte, il ne restreint rien.
#
# LA CONTREPARTIE, ET ELLE S'EST VÉRIFIÉE
#
# Un manifeste se tient à la main, donc il se périme. Le 2026-10-10 il annonçait
# trois catalogues alors que six existaient, et pointait `terraform-training`,
# devenu une simple redirection vers `terraform-dsoxlab-training`. Un apprenant
# qui tapait `dsoxlab catalog list` voyait donc la moitié de l'offre. Chaque
# dépôt ci-dessous a été confronté à l'API GitHub avant d'être écrit : il
# existe, il est public, et son nom est le nom canonique — pas une redirection.
#
# `containers-dsoxlab-training` existe mais reste PRIVÉ : l'inscrire ici
# proposerait un catalogue que personne ne peut cloner.

schema_version: 1

catalogues:
  - id: linux
    depot: https://github.com/stephrobert/linux-dsoxlab-training
    description_en: Linux administration, RHCSA and LFCS
    description_fr: Administration Linux, RHCSA et LFCS

  - id: ansible
    depot: https://github.com/stephrobert/ansible-training
    description_en: Ansible, from first playbook to collections
    description_fr: Ansible, du premier playbook aux collections

  - id: terraform
    depot: https://github.com/stephrobert/terraform-dsoxlab-training
    description_en: Terraform and infrastructure as code
    description_fr: Terraform et l'infrastructure as code

  - id: kubernetes
    depot: https://github.com/stephrobert/kubernetes-dsoxlab-training
    description_en: Kubernetes on a kubeadm cluster, for CKA, CKAD and CKS
    description_fr: Kubernetes sur cluster kubeadm, pour CKA, CKAD et CKS

  - id: devsecops
    depot: https://github.com/stephrobert/devsecops-dsoxlab-training
    description_en: DevSecOps, one application hardened version after version
    description_fr: DevSecOps, une application durcie version après version

  - id: python
    depot: https://github.com/stephrobert/python-dsoxlab-training
    description_en: Python, building a security tool step by step
    description_fr: Python, la construction pas à pas d'un outil de sécurité
